function ch(p,t){if(!p.length)return'<p class=mu>Sin datos todavía.</p>';const W=600,H=170,q=26,mx=Math.max(...p.map(x=>x.v)),mn=t=='l'?Math.min(...p.map(x=>x.v)):0,sp=(mx-mn)||1,bw=(W-2*q)/p.length;let s=`<svg viewBox="0 0 ${W} ${H}"><line x1=${q} x2=${W-q} y1=${H-q} y2=${H-q} stroke="#223040"/>`;
if(t=='b')p.forEach((x,i)=>{const h=x.v/mx*(H-2*q-14);s+=`<rect x=${q+i*bw+bw*.15} y=${H-q-h} width=${bw*.7} height=${h} rx=4 fill="#c6ff3d"/><text x=${q+i*bw+bw/2} y=${H-q-h-4} fill="#8a9bb0" font-size=11 text-anchor=middle>${x.v.toFixed(0)}</text><text x=${q+i*bw+bw/2} y=${H-8} fill="#8a9bb0" font-size=10 text-anchor=middle>${x.l}</text>`});
else{const X=i=>p.length>1?q+i*(W-2*q)/(p.length-1):W/2,Y=v=>q+(v-mn)/sp*(H-2*q-10);s+=`<polyline fill=none stroke="#3dd6ff" stroke-width=3 points="${p.map((x,i)=>X(i)+','+Y(x.v)).join(' ')}"/>`+p.map((x,i)=>`<circle cx=${X(i)} cy=${Y(x.v)} r=4 fill="#3dd6ff"/>`).join('')+`<text x=${q} y=14 fill="#8a9bb0" font-size=11>${fp(p[0].v)}</text><text x=${W-q} y=14 fill="#8a9bb0" font-size=11 text-anchor=end>${fp(p[p.length-1].v)} /km</text>`}return s+'</svg>'}

function co(q){q=q.toLowerCase();const P=plan(),t=today(),nx=P.find(s=>s.date>=t&&!done(s)),r=pr();
if(/dolor|lesi|molest|mare|pecho/.test(q))return'Si el dolor cambia tu forma de correr, o hay mareo o molestia en el pecho: para, descansa y consulta con un profesional sanitario. No te pauto sesiones sobre una lesión.';

if(/hoy|siguiente|próxim|proxim|toca/.test(q))return nx?'Próxima: '+nx.title+' ('+fd(nx.date)+'). '+nx.steps.filter(x=>x.kind=='work').slice(0,1).map(x=>x.label+' '+stT(x)+' a '+stZ(x)).join('')+'. Detalle completo en Entrenamientos.':'No tienes sesiones pendientes.';
